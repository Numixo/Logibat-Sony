<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Logibat Sony — Batteries and headphone sound mode for macOS</title>
<desc id="desc">Interface illustration showing Logitech keyboard and mouse batteries at 60 and 45 percent, and Sony WH-1000XM5 headphones at 33 percent in Ambient Sound mode. Example values.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102a2b"/><stop offset="1" stop-color="#051619"/></linearGradient>
 <linearGradient id="card" x2="0" y2="1"><stop stop-color="#244244"/><stop offset="1" stop-color="#193436"/></linearGradient>
 <filter id="shadow" x="-30%" y="-70%" width="160%" height="240%"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-opacity=".25"/></filter>
 <g id="keyboard" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="0" width="37" height="25" rx="4"/><path d="M7 7h1m6 0h1m6 0h1m6 0h1M7 13h1m6 0h1m6 0h1m6 0h1M9 19h19"/></g>
 <g id="mouse" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><rect x="0" y="0" width="20" height="29" rx="10"/><path d="M10 5v6"/></g>
 <g id="headphones" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M3 21V13C3-2 27-2 27 13V21"/><rect x="1" y="15" width="7" height="13" rx="3"/><rect x="22" y="15" width="7" height="13" rx="3"/></g>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<circle cx="1060" cy="600" r="330" fill="#20483e" opacity=".22"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
 <text x="80" y="82" font-size="23" font-weight="650" fill="#a9e5ce" letter-spacing="2">LOGIBAT SONY</text>
 <text x="80" y="186" font-size="63" font-weight="650" fill="#f4f8ef" letter-spacing="-2">Your batteries.</text>
 <text x="80" y="258" font-size="63" font-weight="650" fill="#f4f8ef" letter-spacing="-2">Your sound mode.</text>
 <text x="83" y="315" font-size="23" fill="#b0c8bf">Logitech MX + Sony WH-1000XM5 · native macOS.</text>
 <g filter="url(#shadow)">
  <rect x="80" y="366" width="1040" height="90" rx="22" fill="url(#card)" stroke="#56706a" stroke-opacity=".5"/>
  <circle cx="120" cy="411" r="5" fill="#a9e5ce"/><text x="144" y="419" font-size="20" font-weight="550" fill="#c0d5cd">Logibat</text>
  <path d="M261 390v42" stroke="#5a756d" stroke-opacity=".6"/>
  <g color="#f4f8ef"><use href="#keyboard" x="320" y="398"/><use href="#mouse" x="535" y="396"/><use href="#headphones" x="730" y="395"/></g>
  <g fill="#f4f8ef" font-size="31" font-weight="550"><text x="375" y="422">60%</text><text x="575" y="422">45%</text><text x="780" y="422">33% AMB</text></g>
  <path d="M1003 390v42" stroke="#5a756d" stroke-opacity=".6"/>
  <text x="1027" y="419" font-size="20" fill="#c0d5cd">09:41</text>
 </g>
 <g font-size="19" fill="#c4d7ca"><text x="83" y="522">Sony sound mode + battery</text><circle cx="355" cy="515" r="2.5" fill="#a9e5ce"/><text x="375" y="522">Choose visible devices</text><circle cx="625" cy="515" r="2.5" fill="#a9e5ce"/><text x="650" y="522">Free &amp; open source</text></g>
 <text x="83" y="582" font-size="14" fill="#88a89b">Interface illustration · example readings · macOS 13+ · Apple silicon download</text>
</g>
